[project]
name = "gogym-api"
version = "0.1.0"
description = "GoGym MVP Backend API — workout planning, scheduling, and logging"
requires-python = ">=3.10"

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
filterwarnings = ["ignore::DeprecationWarning"]

[tool.hypothesis]
max_examples = 100
